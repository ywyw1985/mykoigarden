<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Koi water quality targets</title>
  <desc id="desc">A visual guide showing practical target ranges for koi pond water quality.</desc>
  <rect width="1200" height="760" fill="#f7f4ee"/>
  <rect x="54" y="54" width="1092" height="652" rx="24" fill="#fffdfa" stroke="#d7c7aa" stroke-width="3"/>
  <text x="90" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="800" fill="#24302c">Koi Water Quality Targets</text>
  <text x="90" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#65716d">Use these numbers before medication, after heavy feeding, and during hot weather.</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(90 220)">
      <rect width="310" height="150" rx="18" fill="#edf6f4" stroke="#b9d7d0"/>
      <text x="24" y="46" font-size="22" font-weight="800" fill="#2e6f73">Ammonia</text>
      <text x="24" y="88" font-size="36" font-weight="800" fill="#24302c">0 ppm</text>
      <text x="24" y="122" font-size="18" fill="#65716d">Any reading needs action.</text>
    </g>
    <g transform="translate(445 220)">
      <rect width="310" height="150" rx="18" fill="#edf6f4" stroke="#b9d7d0"/>
      <text x="24" y="46" font-size="22" font-weight="800" fill="#2e6f73">Nitrite</text>
      <text x="24" y="88" font-size="36" font-weight="800" fill="#24302c">0 ppm</text>
      <text x="24" y="122" font-size="18" fill="#65716d">Gill stress can look like disease.</text>
    </g>
    <g transform="translate(800 220)">
      <rect width="310" height="150" rx="18" fill="#edf6f4" stroke="#b9d7d0"/>
      <text x="24" y="46" font-size="22" font-weight="800" fill="#2e6f73">Dissolved oxygen</text>
      <text x="24" y="88" font-size="36" font-weight="800" fill="#24302c">&gt;6 mg/L</text>
      <text x="24" y="122" font-size="18" fill="#65716d">Add air immediately if fish gasp.</text>
    </g>
    <g transform="translate(90 410)">
      <rect width="310" height="150" rx="18" fill="#fff6e7" stroke="#dbc28e"/>
      <text x="24" y="46" font-size="22" font-weight="800" fill="#9b5b19">pH</text>
      <text x="24" y="88" font-size="36" font-weight="800" fill="#24302c">7.0-8.5</text>
      <text x="24" y="122" font-size="18" fill="#65716d">Stability matters more than perfection.</text>
    </g>
    <g transform="translate(445 410)">
      <rect width="310" height="150" rx="18" fill="#fff6e7" stroke="#dbc28e"/>
      <text x="24" y="46" font-size="22" font-weight="800" fill="#9b5b19">KH / alkalinity</text>
      <text x="24" y="88" font-size="36" font-weight="800" fill="#24302c">100-200 ppm</text>
      <text x="24" y="122" font-size="18" fill="#65716d">Buffer against pH crashes.</text>
    </g>
    <g transform="translate(800 410)">
      <rect width="310" height="150" rx="18" fill="#fff6e7" stroke="#dbc28e"/>
      <text x="24" y="46" font-size="22" font-weight="800" fill="#9b5b19">Nitrate</text>
      <text x="24" y="88" font-size="36" font-weight="800" fill="#24302c">&lt;40-80 ppm</text>
      <text x="24" y="122" font-size="18" fill="#65716d">Control with water changes and load.</text>
    </g>
    <text x="90" y="632" font-size="20" fill="#65716d">Targets are practical hobby ranges for koi ponds and tanks; verify with a liquid test kit and product labels.</text>
  </g>
</svg>
