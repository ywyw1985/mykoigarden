<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Koi variety judging layers</title>
  <desc id="desc">A layered guide to judging koi variety quality: health, body, skin, color, pattern, and future development.</desc>
  <rect width="1200" height="720" fill="#f7f4ee"/>
  <rect x="76" y="72" width="1048" height="576" rx="28" fill="#fffdfa" stroke="#d7c7aa" stroke-width="3"/>
  <text x="112" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" fill="#24302c">Koi Variety Judging Layers</text>
  <text x="112" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#65716d">Use variety standards after the fish passes health and body checks.</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">
    <rect x="150" y="245" width="900" height="62" rx="12" fill="#2e6f73"/><text x="185" y="285" fill="#fffdfa">1. Health and behavior</text>
    <rect x="190" y="322" width="820" height="62" rx="12" fill="#3f8788"/><text x="225" y="362" fill="#fffdfa">2. Body conformation and swimming balance</text>
    <rect x="230" y="399" width="740" height="62" rx="12" fill="#caa05e"/><text x="265" y="439" fill="#24302c">3. Skin quality: shiroji, sheen, clarity</text>
    <rect x="270" y="476" width="660" height="62" rx="12" fill="#d63b2f"/><text x="305" y="516" fill="#fffdfa">4. Variety color: beni, sumi, metallic luster</text>
    <rect x="310" y="553" width="580" height="62" rx="12" fill="#24302c"/><text x="345" y="593" fill="#fffdfa">5. Pattern balance and future development</text>
  </g>
</svg>
