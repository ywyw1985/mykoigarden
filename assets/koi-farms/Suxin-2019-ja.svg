<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="title desc" xml:lang="ja" width="560" height="1000" viewBox="0 0 560 1000">
<title id="title">日本の阪井から中国の蘇信へ</title><desc id="desc">Sレジェンドの母はネオユニバース、父はトマホークの系統の名が公表されていない雄です。2019年の仔鯉の母はローズシンボルの娘で、2018年中国大会で総合優勝したSakura Queenです。父鯉候補の2尾はともにSレジェンドの息子で、各個体の父は特定されていません。</desc>
