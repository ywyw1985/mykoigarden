    <text x="568" y="378" font-family="'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="600" fill="#80492F" text-anchor="middle">阪井玫瑰系</text>
    <text x="568" y="408" font-family="'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="400" fill="#435E57" text-anchor="middle">未具名</text>
  </g>
  <text x="177" y="477" font-family="'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="600" fill="#22685C" text-anchor="start">已知母鱼</text>
  <text x="490" y="461" font-family="'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="650" fill="#80492F" text-anchor="middle">候选雄亲</text>
  <g id="suxin-batch">
    <rect x="55" y="557" width="570" height="113" fill="#E7EEE5" rx="10" stroke="#B5C4B4" stroke-width="1.4"/>
    <text x="340" y="595" font-family="'Georgia', 'Bitstream Charter', 'Noto Serif CJK SC', 'Songti SC', serif" font-size="30" font-weight="550" fill="#183D39" text-anchor="middle">同一批受精卵</text>
    <text x="340" y="627" font-family="'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="400" fill="#435E57" text-anchor="middle">两条雄鱼均参与了这次配对。</text>
    <text x="340" y="653" font-family="'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="400" fill="#435E57" text-anchor="middle">场方未公开逐尾后代的父本记录。</text>
  </g>
