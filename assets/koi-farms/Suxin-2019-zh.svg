    <text x="412" y="378" font-family="'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="600" fill="#80492F" text-anchor="middle">阪井玫瑰系</text>
    <text x="412" y="408" font-family="'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="400" fill="#435E57" text-anchor="middle">未具名</text>
  </g>
