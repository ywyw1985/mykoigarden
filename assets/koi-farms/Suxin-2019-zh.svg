    <text x="161" y="217" font-family="'Georgia', 'Bitstream Charter', 'Noto Serif CJK SC', 'Songti SC', serif" font-size="28" font-weight="600" fill="#FFFAEC" text-anchor="middle">Rose Symbol</text>
  </g>
