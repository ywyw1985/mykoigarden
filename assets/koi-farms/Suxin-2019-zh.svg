<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="680" height="810" viewBox="0 0 680 810" role="img" aria-labelledby="chart-title chart-description" xml:lang="zh-CN" style="max-width:100%; height:auto; display:block;">
  <title id="chart-title">2019 年苏信锦鲤繁殖记录：一条母鱼与两条候选雄亲</title>
  <desc id="chart-description">Rose Symbol 的女儿是一条阪井红白，曾获 2018 年中国锦鲤大赛冠军，记录未给出鱼名。S-传说有两条同为阪井玫瑰血统的儿子，原文未具名。2019 年 6 月 9 日，苏州苏信用这条冠军母鱼和两条雄鱼繁殖同一批卵。场方日记未记录每尾后代的具体父本。</desc>
  <defs>
    <marker id="dam" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#22685C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="sire" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#96543B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="810" fill="#FAF7EF" rx="0"/>
  <text x="38" y="39" font-family="'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="700" fill="#22685C" text-anchor="start" letter-spacing="1.7">苏信锦鲤</text>
  <text x="642" y="39" font-family="'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="550" fill="#435E57" text-anchor="end" letter-spacing="1">中国 · 苏州</text>
  <path d="M38 57 H642" fill="none" stroke="#A7B7A7" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="37" y="114" font-family="'Georgia', 'Bitstream Charter', 'Noto Serif CJK SC', 'Songti SC', serif" font-size="45" font-weight="500" fill="#183D39" text-anchor="start">苏信锦鲤的一次繁殖</text>
  <text x="38" y="150" font-family="'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="21" font-weight="400" fill="#435E57" text-anchor="start">2019 年 6 月 9 日，阪井玫瑰血统的两支在苏州配对。</text>
  <g id="reported-relationships">
    <path d="M161 238 V306" fill="none" stroke="#22685C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dam)"/>
    <path d="M490 238 V270 M412 270 H568" fill="none" stroke="#22685C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M412 270 V306" fill="none" stroke="#22685C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dam)"/>
    <path d="M568 270 V306" fill="none" stroke="#22685C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dam)"/>
    <path d="M412 435 V483 H490" fill="none" stroke="#96543B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
    <path d="M568 435 V483 H490" fill="none" stroke="#96543B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
    <path d="M490 483 V517 H440 V552" fill="none" stroke="#96543B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sire)" stroke-dasharray="6 6"/>
    <path d="M161 435 V517 H239 V552" fill="none" stroke="#22685C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dam)"/>
  </g>
