    <text x="412" y="347" font-family="'Georgia', 'Bitstream Charter', 'Noto Serif CJK SC', 'Songti SC', serif" font-size="24" font-weight="650" fill="#183D39" text-anchor="middle">Son 1</text>
    <text x="412" y="378" font-family="'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="600" fill="#80492F" text-anchor="middle">Sakai Rose</text>
    <text x="412" y="408" font-family="'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="400" fill="#435E57" text-anchor="middle">Unnamed</text>
  </g>
  <g id="son-2">
    <rect x="498" y="311" width="140" height="124" fill="#F8EDE4" rx="10" stroke="#D9BEAE" stroke-width="1.4"/>
    <text x="568" y="347" font-family="'Georgia', 'Bitstream Charter', 'Noto Serif CJK SC', 'Songti SC', serif" font-size="24" font-weight="650" fill="#183D39" text-anchor="middle">Son 2</text>
    <text x="568" y="378" font-family="'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="600" fill="#80492F" text-anchor="middle">Sakai Rose</text>
    <text x="568" y="408" font-family="'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="400" fill="#435E57" text-anchor="middle">Unnamed</text>
  </g>
  <text x="177" y="477" font-family="'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="600" fill="#22685C" text-anchor="start">Known dam</text>
  <text x="490" y="461" font-family="'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="15" font-weight="650" fill="#80492F" text-anchor="middle">Possible sires</text>
  <g id="suxin-batch">
    <rect x="55" y="557" width="570" height="113" fill="#E7EEE5" rx="10" stroke="#B5C4B4" stroke-width="1.4"/>
    <text x="340" y="595" font-family="'Georgia', 'Bitstream Charter', 'Noto Serif CJK SC', 'Songti SC', serif" font-size="30" font-weight="550" fill="#183D39" text-anchor="middle">One spawning batch</text>
    <text x="340" y="627" font-family="'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="400" fill="#435E57" text-anchor="middle">Milt from both brothers was used.</text>
    <text x="340" y="653" font-family="'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="19" font-weight="400" fill="#435E57" text-anchor="middle">The sire of each offspring is unrecorded.</text>
  </g>
  <path d="M38 700 H642" fill="none" stroke="#A7B7A7" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="38" y="736" font-family="'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="17" font-weight="650" fill="#183D39" text-anchor="start">Farm diary</text>
  <text x="642" y="736" font-family="'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="16" font-weight="500" fill="#435E57" text-anchor="end">Original graphic by My Koi Garden</text>
