    <text x="161" y="347" font-family="'Georgia', 'Bitstream Charter', 'Noto Serif CJK SC', 'Songti SC', serif" font-size="24" font-weight="650" fill="#183D39" text-anchor="middle">2018 champion</text>
    <text x="161" y="377" font-family="'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="18" font-weight="650" fill="#22685C" text-anchor="middle">China Koi Show</text>
