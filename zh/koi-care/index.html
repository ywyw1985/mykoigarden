          <h1>健康锦鲤从稳定水质开始。</h1>
          <p>饲养锦鲤不是只看水清不清，而是建立稳定的水系统。重点是氨、亚硝酸盐、pH、KH、溶氧、过滤和日常观察。</p>
        </div>

          <h2>核心饲养习惯</h2>
          <p>每天观察游姿、呼吸、食欲和鱼鳍状态。稳定池塘通常每周测试水质；新池、加鱼、暴雨、用药或高温时要增加测试频率。喂食应根据水温和过滤能力调整，未吃完的饲料会迅速增加水质压力。</p>
