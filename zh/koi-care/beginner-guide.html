          <h1>新手先学水，再学鱼。</h1>
          <p>锦鲤的健康首先取决于水。清澈的水不等于安全的水，氨和亚硝酸盐必须用测试剂确认。</p>

          <h2>基础目标</h2>
          <p>氨 0 ppm，亚硝酸盐 0 ppm，pH 稳定，KH 充足，溶氧尽量保持在 6 mg/L 以上。新鱼最好隔离观察 4-6 周。过滤系统需要时间成熟，不要一次性清洗所有生化滤材。</p>
