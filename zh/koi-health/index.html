          <h1>治疗之前，先测水。</h1>
          <p>氨、亚硝酸盐、pH 波动、低溶氧和温度压力会表现得像疾病。盲目下药可能让弱鱼更危险。</p>

          <h2>预防优先</h2>
          <p>记录氨、亚硝酸盐、硝酸盐、pH、KH、水温和溶氧。新鱼隔离，工具分开，发现异常先检查水和过滤。严重溃疡、持续侧翻、快速死亡或大面积感染应寻求专业鱼类兽医帮助。</p>
